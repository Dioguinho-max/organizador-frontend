<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Login | Organizador de Estudos</title>
<link rel="stylesheet" href="login.css">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
</head>
<body>

<div class="login-container">
  <div class="login-card">

    <h2>📚 Organizador de Estudos</h2>

    <div class="input-box">
      <input type="text" id="username" required>
      <label>Usuário</label>
    </div>

    <div class="input-box">
      <input type="password" id="password" required>
      <label>Senha</label>
    </div>

    <button onclick="login()" class="btn-login">Entrar</button>
    <button onclick="register()" class="btn-register">Cadastrar</button>

    <p id="mensagem" class="msg"></p>

  </div>
</div>

<script src="script.js"></script>
</body>
</html>
