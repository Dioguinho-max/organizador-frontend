<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | Organizador de Estudos</title>

<link rel="stylesheet" href="login.css">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
</head>
<body>

<div class="login-container">
  <div class="login-card">

    <h2>📚 Organizador de Estudos</h2>

    <!-- Usuário -->
    <div class="input-box">
      <input type="text" id="username" required>
      <label for="username">Usuário</label>
    </div>

    <!-- Senha -->
    <div class="input-box">
      <input type="password" id="password" required>
      <label for="password">Senha</label>
    </div>

    <button onclick="login()" class="btn-login">Entrar</button>
    <button onclick="register()" class="btn-register">Cadastrar</button>

    <p id="mensagem" class="msg"></p>
    <p class="login-termos">
    Ao se registrar e fazer login você está concordando com os 
    <a href="termos.html" target="_blank">Termos de Serviço</a> 
    e a 
    <a href="privacidade.html" target="_blank">Política de Privacidade</a>.
</p>
    

  </div>
</div>

<!-- FOOTER -->
<footer class="footer">
    <div class="footer-line"></div>

    <div class="footer-container">
        <div class="footer-left">
            <h4>📚 Organizador de Estudos</h4>
            <p>Planeje. Execute. Evolua.</p>
            <a href="termos.html" target="_blank">Termos de Serviço</a> |
        <a href="privacidade.html" target="_blank">Política de Privacidade</a>
        </div>

        <div class="footer-right">
            <p>Versão 1.0.0</p>
            <p>
                © <span id="anoAtual"></span>
                <a href="https://github.com/Dioguinho-max" target="_blank">
                    Dioguinho-max
                </a>
            </p>
        </div>
    </div>
</footer>

<script src="script.js"></script>
</body>
</html>
