<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Dashboard | Organizador de Estudos</title>

    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="stylesheet" href="dashboard.css">
</head>
<body>
    <button id="btnSair" class="btn-sair">🚪 Sair</button>

<div class="container">

    <h1>📚 Minha Dashboard</h1>

    <!-- NOVA TAREFA -->
    <div class="card">
        <h2>Nova Tarefa</h2>

        <input type="text" id="novaTarefa" placeholder="Digite uma tarefa...">
        <input type="text" id="descricaoTarefa" placeholder="Descrição (opcional)">
        <input type="number" id="notaTarefa" placeholder="Nota (0 a 10)" min="0" max="10" step="0.1">

        <button id="btnCriarTarefa">Adicionar</button>
    </div>

    <!-- MINHAS TAREFAS -->
    <div class="card">
        <h2>Minhas Tarefas</h2>
        <ul id="listaTarefas"></ul>
    </div>

    <!-- RANKING -->
    <div class="card">
        <h2>🏆 Ranking</h2>
        <ul id="listaRanking"></ul>
    </div>

</div>

<!-- BOTÕES -->
<button id="btnIA" class="btn-ia">🤖</button>
<button id="btnHistoricoIA" class="btn-historico">📜</button>

<!-- MODAL CHAT -->
<div id="modalIA" class="modal-ia">
  <div class="modal-content-ia">

    <div class="header-ia">
      <h3>Assistente IA</h3>
      <button id="fecharIA">X</button>
    </div>

    <div id="chatIA" class="chat-ia"></div>

    <div class="input-area-ia coluna">
      <input type="text" id="materiaIA" placeholder="Matéria (ex: Matemática)">
      
      <select id="nivelIA">
        <option value="">Selecione o nível</option>
        <option value="iniciante">Iniciante</option>
        <option value="intermediário">Intermediário</option>
        <option value="avançado">Avançado</option>
      </select>

      <input type="number" id="horasIA" placeholder="Horas por dia" min="1" max="24">

      <button id="enviarIA">Gerar Plano</button>
    </div>

  </div>
</div>

<!-- MODAL HISTÓRICO -->
<div id="modalHistoricoIA" class="modal-ia">
  <div class="modal-content-ia">

    <div class="header-ia">
      <h3>Histórico IA</h3>
      <button id="fecharHistoricoIA">X</button>
    </div>

    <div id="historicoIA" class="chat-ia"></div>

  </div>
</div>

<script src="dashboard.js"></script>
</body>
</html>
